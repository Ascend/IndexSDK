<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" font-family="'Huawei Sans','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8faff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#eef2ff;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="header" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a56db"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="layer1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="layer2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="layer2Sub" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
    <linearGradient id="layer3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="layer4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#eff6ff"/>
    </linearGradient>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <filter id="shadowSm" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <clipPath id="round-corner">
      <rect width="920" height="440" rx="16"/>
    </clipPath>
  </defs>
  <rect width="920" height="440" rx="16" fill="url(#bg)"/>
<!--Header-->
  <rect x="0" y="0" width="920" height="52" fill="url(#header)" clip-path="url(#round-corner)"/>
  <text x="475" y="34" text-anchor="middle" fill="white" font-size="22" font-weight="bold" font-family="'Huawei Sans','Helvetica Neue',Arial,sans-serif">Index SDK</text>
<!--API Layer-->
  <text x="15" y="86" fill="#1e40af" font-size="14" font-weight="bold" font-family="'Huawei Sans','Helvetica Neue',Arial,sans-serif">API layer</text>
  <rect x="100" y="66" width="800" height="36" rx="8" fill="url(#layer1)" filter="url(#shadowSm)"/>
  <text x="500" y="90" text-anchor="middle" fill="white" font-size="14" font-weight="bold" font-family="'Huawei Sans','Helvetica Neue',Arial,sans-serif">Faiss-compatible C++ APIs</text>
<!--Algorithm Layer-->
  <text x="15" y="142" fill="#059669" font-size="14" font-weight="bold" font-family="'Huawei Sans','Helvetica Neue',Arial,sans-serif">Algorithm</text>
  <text x="15" y="162" fill="#059669" font-size="14" font-weight="bold" font-family="'Huawei Sans','Helvetica Neue',Arial,sans-serif">layer</text>
<!--Faiss Built-in Algorithm Pool-->
  <rect x="100" y="120" width="386" height="86" rx="10" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="4,2"/>
  <rect x="100" y="120" width="386" height="36" rx="10" fill="url(#layer2)"/>
  <text x="293" y="144" text-anchor="middle" fill="white" font-size="14" font-weight="bold" font-family="'Huawei Sans','Helvetica Neue',Arial,sans-serif">Faiss built-in algorithm pool</text>
<!--Product Extended Algorithm Pool-->
  <rect x="500" y="120" width="400" height="86" rx="10" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="4,2"/>
  <rect x="500" y="120" width="400" height="36" rx="10" fill="url(#layer2)"/>
  <text x="700" y="144" text-anchor="middle" fill="white" font-size="14" font-weight="bold" font-family="'Huawei Sans','Helvetica Neue',Arial,sans-serif">Product extended algorithm pool</text>
<!--Faiss Algorithms-->
  <rect x="110" y="162" width="80" height="32" rx="6" fill="url(#layer2Sub)" filter="url(#shadowSm)"/>
  <text x="150" y="182" text-anchor="middle" fill="white" font-size="12" font-weight="bold" font-family="'Huawei Sans','Helvetica Neue',Arial,sans-serif">IVFFlat</text>
  <rect x="198" y="162" width="80" height="32" rx="6" fill="url(#layer2Sub)" filter="url(#shadowSm)"/>
  <text x="238" y="182" text-anchor="middle" fill="white" font-size="12" font-weight="bold" font-family="'Huawei Sans','Helvetica Neue',Arial,sans-serif">IVFPQ</text>
  <rect x="286" y="162" width="80" height="32" rx="6" fill="url(#layer2Sub)" filter="url(#shadowSm)"/>
  <text x="326" y="182" text-anchor="middle" fill="white" font-size="12" font-weight="bold" font-family="'Huawei Sans','Helvetica Neue',Arial,sans-serif">Flat</text>
  <rect x="374" y="162" width="100" height="32" rx="6" fill="url(#layer2Sub)" filter="url(#shadowSm)"/>
  <text x="424" y="182" text-anchor="middle" fill="white" font-size="12" font-weight="bold" font-family="'Huawei Sans','Helvetica Neue',Arial,sans-serif">RaBitQ</text>
<!--Product Extended Algorithms-->
  <rect x="510" y="162" width="90" height="32" rx="6" fill="url(#layer2Sub)" filter="url(#shadowSm)"/>
  <text x="555" y="182" text-anchor="middle" fill="white" font-size="12" font-weight="bold" font-family="'Huawei Sans','Helvetica Neue',Arial,sans-serif">TS</text>
  <rect x="608" y="162" width="90" height="32" rx="6" fill="url(#layer2Sub)" filter="url(#shadowSm)"/>
  <text x="653" y="182" text-anchor="middle" fill="white" font-size="12" font-weight="bold" font-family="'Huawei Sans','Helvetica Neue',Arial,sans-serif">ILFlat</text>
  <rect x="706" y="162" width="90" height="32" rx="6" fill="url(#layer2Sub)" filter="url(#shadowSm)"/>
  <text x="751" y="182" text-anchor="middle" fill="white" font-size="12" font-weight="bold" font-family="'Huawei Sans','Helvetica Neue',Arial,sans-serif">IVFSP</text>
  <rect x="804" y="162" width="85" height="32" rx="6" fill="url(#layer2Sub)" filter="url(#shadowSm)"/>
  <text x="846" y="182" text-anchor="middle" fill="white" font-size="12" font-weight="bold" font-family="'Huawei Sans','Helvetica Neue',Arial,sans-serif">Graph</text>
<!--Acceleration Layer-->
  <text x="15" y="250" fill="#d97706" font-size="14" font-weight="bold" font-family="'Huawei Sans','Helvetica Neue',Arial,sans-serif">Acceleration</text>
  <text x="15" y="270" fill="#d97706" font-size="14" font-weight="bold" font-family="'Huawei Sans','Helvetica Neue',Arial,sans-serif">layer</text>
  <rect x="100" y="226" width="188" height="36" rx="8" fill="url(#layer3)" filter="url(#shadowSm)"/>
  <text x="194" y="250" text-anchor="middle" fill="white" font-size="14" font-weight="bold" font-family="'Huawei Sans','Helvetica Neue',Arial,sans-serif">Sort optimization</text>
  <rect x="300" y="226" width="188" height="36" rx="8" fill="url(#layer3)" filter="url(#shadowSm)"/>
  <text x="394" y="250" text-anchor="middle" fill="white" font-size="14" font-weight="bold" font-family="'Huawei Sans','Helvetica Neue',Arial,sans-serif">Similarity computation</text>
  <rect x="500" y="226" width="188" height="36" rx="8" fill="url(#layer3)" filter="url(#shadowSm)"/>
  <text x="594" y="250" text-anchor="middle" fill="white" font-size="14" font-weight="bold" font-family="'Huawei Sans','Helvetica Neue',Arial,sans-serif">Attribute filtering</text>
  <rect x="700" y="226" width="200" height="36" rx="8" fill="url(#layer3)" filter="url(#shadowSm)"/>
  <text x="800" y="250" text-anchor="middle" fill="white" font-size="14" font-weight="bold" font-family="'Huawei Sans','Helvetica Neue',Arial,sans-serif">Dimensionality reduction</text>
<!--Hardware Layer-->
  <rect x="20" y="294" width="880" height="46" rx="10" fill="url(#layer4)" filter="url(#shadow)"/>
  <text x="460" y="324" text-anchor="middle" fill="white" font-size="16" font-weight="bold" font-family="'Huawei Sans','Helvetica Neue',Arial,sans-serif">CANN</text>
<!--Footer-->
  <rect x="20" y="358" width="880" height="62" rx="10" fill="url(#footerBg)" filter="url(#shadow)" stroke="#e2e8f0" stroke-width="1"/>
  <text x="140" y="395" text-anchor="middle" fill="#1e40af" font-size="14" font-weight="bold" font-family="'Huawei Sans','Helvetica Neue',Arial,sans-serif">Brute-force search</text>
  <circle cx="210" cy="390" r="2.5" fill="#94a3b8"/>
  <text x="345" y="395" text-anchor="middle" fill="#1e40af" font-size="14" font-weight="bold" font-family="'Huawei Sans','Helvetica Neue',Arial,sans-serif">Approximate nearest neighbor search</text>
  <circle cx="480" cy="390" r="2.5" fill="#94a3b8"/>
  <text x="570" y="395" text-anchor="middle" fill="#1e40af" font-size="14" font-weight="bold" font-family="'Huawei Sans','Helvetica Neue',Arial,sans-serif">Attribute-filtered search</text>
  <circle cx="662" cy="390" r="2.5" fill="#94a3b8"/>
  <text x="760" y="385" text-anchor="middle" fill="#1e40af" font-size="14" font-weight="bold" font-family="'Huawei Sans','Helvetica Neue',Arial,sans-serif">Heterogeneous computing</text>
  <text x="750" y="405" text-anchor="middle" fill="#1e40af" font-size="14" font-weight="bold" font-family="'Huawei Sans','Helvetica Neue',Arial,sans-serif">platform support</text>
</svg>
